<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CsillingShop Admin</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    padding:20px;
    margin:0;
}

.box{
    max-width:550px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px #ccc;
}

h1{
    margin-top:0;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:15px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    width:100%;
    padding:12px;
    background:#20b2aa;
    color:white;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    transition:0.2s;
}

button:hover{
    background:#159a94;
    transform:translateY(-1px);
}


/* ===== TERMÉK ===== */

.termek{
    background:#eee;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
}

.termek img{
    width:100px;
    height:100px;
    object-fit:cover;
    border-radius:8px;
    display:block;
    margin-bottom:10px;
}

.termek h3{
    margin:8px 0;
}

.termek p{
    margin:6px 0;
}


/* ===== SZERKESZTŐ ===== */

.szerkeszto{
    background:white;
    border:1px solid #ccc;
    border-radius:10px;
    padding:12px;
    margin-top:12px;
    display:none;
}

.szerkeszto.aktiv{
    display:block;
}

.szerkeszto label{
    display:block;
    font-weight:bold;
    margin-top:8px;
}

.szerkeszto input,
.szerkeszto select{
    margin-top:5px;
}


/* ===== GOMBOK ===== */

.gombok{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.gombok button{
    flex:1;
}

.szerkesztes-gomb{
    background:#20b2aa;
}

.szerkesztes-gomb:hover{
    background:#159a94;
}

.torles-gomb{
    background:#d93636;
}

.torles-gomb:hover{
    background:#b92828;
}

.mentes-gomb{
    background:#198754;
}

.mentes-gomb:hover{
    background:#147044;
}

.megse-gomb{
    background:#777;
}

.megse-gomb:hover{
    background:#5f5f5f;
}


/* ===== ELÉRHETŐSÉG ===== */

.allapot-elerheto{
    color:#16823d;
    font-weight:bold;
}

.allapot-kifogyott{
    color:#c62828;
    font-weight:bold;
}


/* ===== ÜZENET ===== */

#uzenet{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    display:none;
    font-weight:bold;
}


/* ===== MOBIL ===== */

@media(max-width:700px){

    body{
        padding:10px;
        overflow-x:hidden;
    }

    .box{
        width:100%;
        padding:18px 14px;
    }

    h1{
        font-size:25px;
    }

    input,
    select,
    textarea{
        box-sizing:border-box;
        font-size:16px;
    }

    .termek{
        display:flex;
        flex-direction:column;
    }

    .termek img{
        width:100%;
        max-width:180px;
        height:auto;
        align-self:center;
    }

    .gombok{
        flex-direction:column;
    }

    button{
        width:100%;
    }

}

</style>

</head>

<body>

<div class="box">

    <h1>⚙️ CsillingShop Admin</h1>


    <!-- ==============================
         ÚJ TERMÉK
    =============================== -->

    <h3>Új termék hozzáadása</h3>

    <input
        id="nev"
        placeholder="Termék neve"
    >

    <input
        id="ar"
        type="number"
        placeholder="Ár Ft-ban"
    >

    <select id="kat">

        <option value="Sport kiegészítők">
            🏋️ Sport kiegészítők
        </option>

        <option value="Gyerek játékok">
            🧸 Gyerek játékok
        </option>

        <option value="Tini cuccok">
            ✨ Tini cuccok
        </option>

    </select>


    <input
        id="kep"
        placeholder="Kép neve (pl. rajz.jpg)"
    >


    <textarea
        id="leiras"
        placeholder="Termék leírása"
    ></textarea>


    <select id="allapot">

        <option value="Elérhető">
            Elérhető
        </option>

        <option value="Kifogyott">
            Kifogyott
        </option>

    </select>


    <button onclick="hozzaad()">
        ➕ Termék mentése
    </button>


    <div id="uzenet"></div>


    <!-- ==============================
         TERMÉKEK
    =============================== -->

    <h2>
        Termékek
    </h2>

    <div id="lista"></div>

</div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
    "https://sgzvnszxgfscqammnfpy.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_1XKBoPFGeMsHbYM_9PAO5A_KtI5TeKm";


/* ==========================================
   ADMIN ELLENŐRZÉS
========================================== */

if(localStorage.getItem("admin") !== "igen"){

    window.location.href = "admin-login.html";

}


/* ==========================================
   SUPABASE KÉRÉS
========================================== */

async function supabaseFetch(url, options = {}){

    const response = await fetch(
        SUPABASE_URL + url,
        {
            ...options,

            headers:{
                "apikey":SUPABASE_KEY,
                "Authorization":"Bearer " + SUPABASE_KEY,
                "Content-Type":"application/json",

                ...(options.headers || {})
            }
        }
    );


    if(!response.ok){

        const errorText = await response.text();

        throw new Error(errorText);

    }


    if(response.status === 204){
        return null;
    }


    return await response.json();

}


/* ==========================================
   ÜZENET
========================================== */

function uzenet(szoveg, siker = true){

    const elem =
        document.getElementById("uzenet");

    elem.style.display = "block";

    elem.style.background =
        siker ? "#d1fae5" : "#fee2e2";

    elem.style.color =
        siker ? "#166534" : "#991b1b";

    elem.innerText = szoveg;


    setTimeout(()=>{

        elem.style.display = "none";

    },4000);

}


/* ==========================================
   TERMÉKEK BETÖLTÉSE
========================================== */

async function betoltTermekek(){

    try{

        const termekek =
            await supabaseFetch(
                "/rest/v1/termekek?select=*&order=id.desc"
            );


        mutat(termekek);

    }

    catch(error){

        console.error(error);

        uzenet(
            "Hiba történt a termékek betöltésekor.",
            false
        );

    }

}


/* ==========================================
   ÚJ TERMÉK HOZZÁADÁSA
========================================== */

async function hozzaad(){

    const nev =
        document.getElementById("nev")
        .value
        .trim();


    const ar =
        document.getElementById("ar")
        .value
        .trim();


    const kat =
        document.getElementById("kat")
        .value;


    const kep =
        document.getElementById("kep")
        .value
        .trim();


    const leiras =
        document.getElementById("leiras")
        .value
        .trim();


    const allapot =
        document.getElementById("allapot")
        .value;


    /* Ellenőrzés */

    if(!nev){

        alert("Írd be a termék nevét!");

        return;

    }


    if(!ar){

        alert("Írd be a termék árát!");

        return;

    }


    if(!kep){

        alert("Írd be a kép nevét!");

        return;

    }


    try{

        await supabaseFetch(
            "/rest/v1/termekek",
            {
                method:"POST",

                headers:{
                    "Prefer":"return=minimal"
                },

                body:JSON.stringify({

                    nev:nev,

                    ar:Number(ar),

                    kat:kat,

                    kep:kep,

                    leiras:leiras,

                    allapot:allapot

                })

            }
        );


        /* Mezők törlése */

        document.getElementById("nev").value = "";

        document.getElementById("ar").value = "";

        document.getElementById("kep").value = "";

        document.getElementById("leiras").value = "";

        document.getElementById("allapot").value =
            "Elérhető";


        uzenet(
            "A termék sikeresen hozzáadva!"
        );


        betoltTermekek();

    }

    catch(error){

        console.error(error);

        uzenet(
            "Hiba történt a termék mentésekor.",
            false
        );

    }

}


/* ==========================================
   TERMÉKEK MEGJELENÍTÉSE
========================================== */

function mutat(termekek){

    const lista =
        document.getElementById("lista");


    lista.innerHTML = "";


    if(!termekek || termekek.length === 0){

        lista.innerHTML =
            "<p>Még nincs hozzáadott termék.</p>";

        return;

    }


    termekek.forEach((t)=>{


        const allapotClass =
            t.allapot === "Elérhető"
            ? "allapot-elerheto"
            : "allapot-kifogyott";


        lista.innerHTML += `

        <div class="termek">

            <img
                src="kepek/${escapeHtml(t.kep)}"
                alt="${escapeHtml(t.nev)}"
            >


            <h3>
                ${escapeHtml(t.nev)}
            </h3>


            <p>

                <strong>Ár:</strong>

                ${escapeHtml(t.ar)} Ft

            </p>


            <p>

                <strong>Kategória:</strong>

                ${escapeHtml(t.kat)}

            </p>


            <p class="${allapotClass}">

                <strong>Állapot:</strong>

                ${escapeHtml(t.allapot)}

            </p>


            <div class="gombok">

                <button
                    class="szerkesztes-gomb"
                    onclick="szerkeszt(${t.id})"
                >

                    ✏️ Szerkesztés

                </button>


                <button
                    class="torles-gomb"
                    onclick="torol(${t.id}, '${escapeJs(t.nev)}')"
                >

                    🗑️ Törlés

                </button>

            </div>


            <div
                class="szerkeszto"
                id="szerkeszto-${t.id}"
            >

                <strong>
                    Csak az ár és az elérhetőség módosítható
                </strong>


                <label>
                    Ár (Ft)
                </label>


                <input
                    type="number"
                    id="modositottAr-${t.id}"
                    value="${t.ar}"
                    min="0"
                >


                <label>
                    Elérhetőség
                </label>


                <select
                    id="modositottAllapot-${t.id}"
                >

                    <option
                        value="Elérhető"
                        ${t.allapot === "Elérhető"
                            ? "selected"
                            : ""}
                    >

                        Elérhető

                    </option>


                    <option
                        value="Kifogyott"
                        ${t.allapot === "Kifogyott"
                            ? "selected"
                            : ""}
                    >

                        Kifogyott

                    </option>

                </select>


                <div class="gombok">

                    <button
                        class="mentes-gomb"
                        onclick="modositasMentese(${t.id})"
                    >

                        💾 Mentés

                    </button>


                    <button
                        class="megse-gomb"
                        onclick="szerkesztesBezarsa(${t.id})"
                    >

                        Mégse

                    </button>

                </div>

            </div>

        </div>

        `;

    });

}


/* ==========================================
   SZERKESZTÉS MEGNYITÁSA
========================================== */

function szerkeszt(id){

    const szerkeszto =
        document.getElementById(
            "szerkeszto-" + id
        );


    if(szerkeszto){

        szerkeszto.classList.add("aktiv");

    }

}


/* ==========================================
   SZERKESZTÉS BEZÁRÁSA
========================================== */

function szerkesztesBezarsa(id){

    const szerkeszto =
        document.getElementById(
            "szerkeszto-" + id
        );


    if(szerkeszto){

        szerkeszto.classList.remove("aktiv");

    }

}


/* ==========================================
   MÓDOSÍTÁS MENTÉSE
========================================== */

async function modositasMentese(id){

    const ujAr =
        document.getElementById(
            "modositottAr-" + id
        )
        .value
        .trim();


    const ujAllapot =
        document.getElementById(
            "modositottAllapot-" + id
        )
        .value;


    if(!ujAr){

        alert("Adj meg egy árat!");

        return;

    }


    if(Number(ujAr) < 0){

        alert("Az ár nem lehet negatív!");

        return;

    }


    try{

        await supabaseFetch(
            "/rest/v1/termekek?id=eq." + id,
            {
                method:"PATCH",

                headers:{
                    "Prefer":"return=minimal"
                },

                body:JSON.stringify({

                    ar:Number(ujAr),

                    allapot:ujAllapot

                })

            }
        );


        uzenet(
            "A módosítás sikeresen elmentve!"
        );


        betoltTermekek();

    }

    catch(error){

        console.error(error);

        uzenet(
            "Hiba történt a módosítás mentésekor.",
            false
        );

    }

}


/* ==========================================
   TERMÉK TÖRLÉSE
========================================== */

async function torol(id, nev){

    const biztos =
        confirm(
            "Biztosan törölni szeretnéd ezt a terméket?\n\n"
            + nev
        );


    if(!biztos){

        return;

    }


    try{

        await supabaseFetch(
            "/rest/v1/termekek?id=eq." + id,
            {
                method:"DELETE",

                headers:{
                    "Prefer":"return=minimal"
                }

            }
        );


        uzenet(
            "A termék sikeresen törölve!"
        );


        betoltTermekek();

    }

    catch(error){

        console.error(error);

        uzenet(
            "Hiba történt a termék törlésekor.",
            false
        );

    }

}


/* ==========================================
   HTML BIZTONSÁG
========================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeJs(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\n/g,"\\n")
        .replace(/\r/g,"\\r");

}


/* ==========================================
   INDÍTÁS
========================================== */

betoltTermekek();

</script>

</body>
</html>
