<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CsillingShop - Kosár</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #073b4c,
            #006f70,
            #00a6a6
        );

    min-height: 100vh;
    padding: 30px 15px;

    color: #123;
}

.box {
    max-width: 700px;
    margin: auto;

    background: rgba(255,255,255,0.97);

    padding: 30px;

    border-radius: 20px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.25);
}

/* =========================================
   CÍM
========================================= */

h1 {
    text-align: center;

    color: #007f83;

    margin-top: 0;
    margin-bottom: 25px;
}

h2 {
    color: #006f70;

    border-bottom:
        2px solid #b9eeee;

    padding-bottom: 8px;
}

h3 {
    color: #007f83;

    margin-bottom: 8px;
}

/* =========================================
   KOSÁR
========================================= */

.item {

    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 15px;

    background:
        linear-gradient(
            135deg,
            #e0fafa,
            #c8f1f1
        );

    border:
        1px solid #9cdddd;

    padding: 14px;

    margin: 12px 0;

    border-radius: 12px;

    box-shadow:
        0 4px 10px rgba(0,100,100,0.08);
}

.item-info {
    min-width: 0;
}

.item-name {
    color: #155b5c;

    font-weight: bold;

    overflow-wrap: anywhere;
}

.item-price {
    color: #007f83;

    margin-top: 5px;

    font-weight: bold;
}

.remove-button {

    width: auto;

    background: #e74c3c;

    color: white;

    border: none;

    padding: 9px 13px;

    border-radius: 8px;

    cursor: pointer;

    flex-shrink: 0;

    font-size: 16px;
}

.remove-button:hover {
    background: #c0392b;
}

/* =========================================
   ÜRES KOSÁR
========================================= */

.empty {

    text-align: center;

    padding: 25px 15px;

    background:
        #e0fafa;

    border:
        1px solid #9cdddd;

    border-radius: 12px;

    color: #176263;

    font-weight: bold;
}

/* =========================================
   VÉGÖSSZEG
========================================= */

.summary {

    background:
        linear-gradient(
            135deg,
            #d9fafa,
            #c3eeee
        );

    padding: 18px;

    border-radius: 15px;

    margin-top: 20px;

    border:
        1px solid #9cdddd;
}

.summary-row {

    display: flex;

    justify-content: space-between;

    margin: 8px 0;

    color: #245d5e;
}

.summary-total {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-top: 15px;

    padding-top: 15px;

    border-top:
        2px solid #9cdddd;

    font-size: 21px;

    font-weight: bold;

    color: #007f83;
}

#osszeg {
    font-size: 28px;

    color: #00a19d;
}

/* =========================================
   INPUTOK
========================================= */

input,
select {

    width: 100%;

    padding: 13px;

    margin: 8px 0;

    border:
        2px solid #b5e5e5;

    border-radius: 10px;

    background:
        #f2ffff;

    color: #145b5c;

    font-size: 16px;

    outline: none;
}

input:focus,
select:focus {

    border-color:
        #00a6a6;

    box-shadow:
        0 0 0 3px
        rgba(0,166,166,0.12);
}

select {
    cursor: pointer;
}

/* =========================================
   FIZETÉS GOMB
========================================= */

.pay-button {

    width: 100%;

    margin-top: 20px;

    background:
        linear-gradient(
            135deg,
            #00c6c6,
            #008f91
        );

    color: white;

    border: none;

    padding: 14px;

    border-radius: 11px;

    cursor: pointer;

    font-size: 17px;

    font-weight: bold;

    box-shadow:
        0 5px 15px
        rgba(0,130,130,0.25);

    transition: 0.2s;
}

.pay-button:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 20px
        rgba(0,130,130,0.35);
}

.pay-button:active {
    transform: translateY(0);
}

/* =========================================
   VISSZA
========================================= */

.back-button {

    width: 100%;

    margin-top: 10px;

    padding: 12px;

    border: 2px solid #00a6a6;

    border-radius: 10px;

    background: white;

    color: #007f83;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}

.back-button:hover {

    background:
        #e0fafa;
}

/* =========================================
   MOBIL
========================================= */

@media(max-width:700px) {

    body {
        padding: 10px;
    }

    .box {

        width: 100%;

        padding:
            20px 15px;

        border-radius:
            16px;
    }

    h1 {
        font-size: 25px;
    }

    h2 {
        font-size: 20px;
    }

    .item {

        padding: 10px;

        gap: 10px;
    }

    .item-name {
        font-size: 14px;
    }

    .item-price {
        font-size: 14px;
    }

    .remove-button {
        padding: 8px 10px;
    }

    input,
    select {
        font-size: 16px;
    }

    .summary-total {
        font-size: 18px;
    }

    #osszeg {
        font-size: 24px;
    }

}

</style>

</head>


<body>


<div class="box">

    <h1>
        🛒 CsillingShop Kosár
    </h1>


    <!-- =====================================
         KOSÁR
    ====================================== -->

    <div id="kosar"></div>


    <!-- =====================================
         ÖSSZEG
    ====================================== -->

    <div class="summary">

        <div class="summary-row">

            <span>
                🛍️ Termékek:
            </span>

            <strong>
                <span id="termekOsszeg">
                    0
                </span>
                Ft
            </strong>

        </div>


        <div class="summary-row">

            <span>
                🚚 Szállítás:
            </span>

            <strong>
                <span id="szallitasOsszeg">
                    0
                </span>
                Ft
            </strong>

        </div>


        <div class="summary-total">

            <span>
                Végösszeg:
            </span>

            <span>
                <span id="osszeg">
                    0
                </span>
                Ft
            </span>

        </div>

    </div>


    <!-- =====================================
         SZÁLLÍTÁSI ADATOK
    ====================================== -->

    <h2>
        📦 Szállítási adatok
    </h2>


    <input
        id="nev"
        type="text"
        placeholder="Név"
        autocomplete="name"
    >


    <input
        id="cim"
        type="text"
        placeholder="Cím"
        autocomplete="street-address"
    >


    <input
        id="email"
        type="email"
        placeholder="E-mail"
        autocomplete="email"
    >


    <h3>
        🚚 Szállítási mód
    </h3>


    <select id="szallitas">

        <option value="Csomagautomata - 999 Ft">
            📦 Csomagautomata - 999 Ft
        </option>

        <option value="Futár házhoz - 1990 Ft">
            🚚 Futár házhoz - 1990 Ft
        </option>

        <option value="Személyes átvétel - 0 Ft">
            🤝 Személyes átvétel - 0 Ft
        </option>

    </select>


    <!-- =====================================
         FIZETÉS
    ====================================== -->

    <button
        class="pay-button"
        onclick="fizetesre()"
    >
        💳 Tovább a fizetéshez
    </button>


    <button
        class="back-button"
        onclick="vissza()"
    >
        ← Vásárlás folytatása
    </button>


</div>


<script>

/* =========================================
   KOSÁR BETÖLTÉSE
========================================= */

let kosar =
    JSON.parse(
        localStorage.getItem("kosar")
    ) || [];


/* =========================================
   SZÁLLÍTÁSI DÍJ
========================================= */

function szallitasiAr() {

    const szallitas =
        document.getElementById(
            "szallitas"
        );

    if (!szallitas) {
        return 0;
    }


    if (
        szallitas.value.includes("999")
    ) {
        return 999;
    }


    if (
        szallitas.value.includes("1990")
    ) {
        return 1990;
    }


    return 0;
}


/* =========================================
   KOSÁR MEGJELENÍTÉSE
========================================= */

function mutat() {

    const lista =
        document.getElementById(
            "kosar"
        );


    lista.innerHTML = "";


    let termekOsszeg = 0;


    if (kosar.length === 0) {

        lista.innerHTML = `

            <div class="empty">

                🛒 A kosarad jelenleg üres.

            </div>

        `;

    } else {

        kosar.forEach(
            function(t, index) {

                const ar =
                    Number(t.ar) || 0;


                termekOsszeg += ar;


                lista.innerHTML += `

                    <div class="item">

                        <div class="item-info">

                            <div class="item-name">
                                ${escapeHTML(
                                    t.nev || "Ismeretlen termék"
                                )}
                            </div>

                            <div class="item-price">
                                ${ar.toLocaleString(
                                    "hu-HU"
                                )} Ft
                            </div>

                        </div>


                        <button
                            class="remove-button"
                            onclick="torol(${index})"
                            title="Termék törlése"
                        >
                            ❌
                        </button>

                    </div>

                `;

            }
        );

    }


    const szallitas =
        szallitasiAr();


    const vegosszeg =
        termekOsszeg +
        szallitas;


    document.getElementById(
        "termekOsszeg"
    ).textContent =
        termekOsszeg.toLocaleString(
            "hu-HU"
        );


    document.getElementById(
        "szallitasOsszeg"
    ).textContent =
        szallitas.toLocaleString(
            "hu-HU"
        );


    document.getElementById(
        "osszeg"
    ).textContent =
        vegosszeg.toLocaleString(
            "hu-HU"
        );

}


/* =========================================
   HTML BIZTONSÁG
========================================= */

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}


/* =========================================
   TERMÉK TÖRLÉSE
========================================= */

function torol(index) {

    if (
        index < 0 ||
        index >= kosar.length
    ) {
        return;
    }


    kosar.splice(
        index,
        1
    );


    localStorage.setItem(
        "kosar",
        JSON.stringify(
            kosar
        )
    );


    mutat();

}


/* =========================================
   FIZETÉSRE TOVÁBBÍTÁS
========================================= */

function fizetesre() {

    if (
        kosar.length === 0
    ) {

        alert(
            "🛒 A kosarad üres!"
        );

        return;
    }


    const nev =
        document.getElementById(
            "nev"
        ).value.trim();


    const cim =
        document.getElementById(
            "cim"
        ).value.trim();


    const email =
        document.getElementById(
            "email"
        ).value.trim();


    const szallitas =
        document.getElementById(
            "szallitas"
        ).value;


    /* =====================================
       ADATOK ELLENŐRZÉSE
    ====================================== */

    if (
        nev === "" ||
        cim === "" ||
        email === ""
    ) {

        alert(
            "⚠️ Kérlek, töltsd ki az összes szállítási adatot!"
        );

        return;
    }


    /* =====================================
       E-MAIL ELLENŐRZÉSE
    ====================================== */

    const emailMinta =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if (
        !emailMinta.test(email)
    ) {

        alert(
            "⚠️ Kérlek, adj meg egy érvényes e-mail címet!"
        );

        return;
    }


    /* =====================================
       ADATOK MENTÉSE
    ====================================== */

    localStorage.setItem(
        "fizetes_nev",
        nev
    );


    localStorage.setItem(
        "fizetes_cim",
        cim
    );


    localStorage.setItem(
        "fizetes_email",
        email
    );


    localStorage.setItem(
        "fizetes_szallitas",
        szallitas
    );


    /* =====================================
       FIZETÉS OLDAL
    ====================================== */

    window.location.href =
        "fizetes.html";

}


/* =========================================
   VISSZA A WEBSHOPBA
========================================= */

function vissza() {

    window.location.href =
        "index.html";

}


/* =========================================
   SZÁLLÍTÁS VÁLTOZÁSA
========================================= */

document.getElementById(
    "szallitas"
).addEventListener(
    "change",
    function() {

        mutat();

    }
);


/* =========================================
   OLDAL BETÖLTÉS
========================================= */

mutat();

</script>


</body>
</html>
